name: Reportar bug / Bug report
description: Algo no funciona / Something is not working
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: desc
    attributes:
      label: Qué pasa / What happens
      description: Describe el problema con detalle.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo / Steps to reproduce
      placeholder: "1. Abro MyDisplays... 2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas / What you expected
  - type: input
    id: system
    attributes:
      label: Sistema / System
      description: Distro, kernel y versión de Hyprland.
      placeholder: "p.ej. Omarchy, kernel 7.1, Hyprland 0.56"
    validations:
      required: true
  - type: input
    id: monitors
    attributes:
      label: Monitores / Monitors
      placeholder: "p.ej. eDP-1 2880x1800@120 + HDMI-A-2 3840x2160@60"
  - type: input
    id: logs
    attributes:
      label: Log (opcional)
      description: Contenido de ~/.config/hypr/monitor-profiles/mydisplays.log
  - type: textarea
    id: extra
    attributes:
      label: Más contexto / Extra context
